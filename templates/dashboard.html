<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
<div class="container">

<div class="hero">
<h1>Dashboard</h1>
</div>

<div class="stats-grid">
<div class="stat-card">Moyenne note {{ avg_grade }}</div>
<div class="stat-card">Moyenne heures {{ avg_hours }}</div>
<div class="stat-card">Corrélation {{ correlation }}</div>
</div>

<canvas id="chart"></canvas>

<script>
new Chart(document.getElementById("chart"), {
type: 'bar',
data: {
labels: {{ major_counts.keys() | list | safe }},
datasets: [{
label: "Filières",
data: {{ major_counts.values() | list | safe }}
}]
}
});
</script>

<div>{{ table | safe }}</div>

</div>
</body>
</html>
