<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<button onclick="toggleDark()">🌙 Mode sombre</button>

<div class="hero">
<h1>Dashboard</h1>
</div>

<!-- KPI -->
<div class="grid">
<div class="card"><div class="kpi" id="k1"></div>Moyenne note</div>
<div class="card"><div class="kpi" id="k2"></div>Moyenne heures</div>
<div class="card"><div class="kpi" id="k3"></div>Corrélation</div>
</div>

<br>

<!-- FILTRE -->
<select id="filter">
<option value="all">Tous</option>
<option value="Informatique">Informatique</option>
<option value="Sciences">Sciences</option>
<option value="Économie">Économie</option>
</select>

<br><br>

<canvas id="chart"></canvas>

<ul>
{% for row in data %}
<li>{{ row.grade }} - {{ row.hours }}h 
<a href="/delete/{{ loop.index0 }}">❌</a>
</li>
{% endfor %}
</ul>

<script>

// KPI animation
function animate(id, value) {
    let i = 0;
    let el = document.getElementById(id);
    let interval = setInterval(() => {
        i += value/20;
        if(i >= value) { i = value; clearInterval(interval); }
        el.innerText = i.toFixed(2);
    }, 50);
}

animate("k1", {{ avg_grade }});
animate("k2", {{ avg_hours }});
animate("k3", {{ correlation }});

// DATA
let grades = {{ grades|safe }};
let hours = {{ hours|safe }};
let majors = {{ majors|safe }};

// CHART
let chart = new Chart(document.getElementById("chart"), {
type:'scatter',
data:{
datasets:[{
label:"Corrélation",
data: grades.map((g,i)=>({x:hours[i], y:g}))
}]
}
});

// FILTER
document.getElementById("filter").addEventListener("change", e=>{
    let val = e.target.value;
    let filtered = grades.map((g,i)=>({
        g, h:hours[i], m:majors[i]
    })).filter(x=> val==="all" || x.m===val);

    chart.data.datasets[0].data = filtered.map(x=>({x:x.h,y:x.g}));
    chart.update();
});

// DARK MODE
function toggleDark(){
    document.body.classList.toggle("dark");
}

</script>
