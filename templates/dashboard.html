<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/static/style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>

</head>

<body>

<div class="container fade-in">

<div class="hero">
    <h1>📊 Dashboard Analytics</h1>
    <p>Analyse intelligente des performances</p>
</div>

<!-- STATS -->
<div class="dashboard-grid">
    <div class="card">
        <h3>Moyenne note</h3>
        <div class="stat">{{ avg_grade }}</div>
    </div>

    <div class="card">
        <h3>Moyenne heures</h3>
        <div class="stat">{{ avg_hours }}</div>
    </div>

    <div class="card">
        <h3>Corrélation</h3>
        <div class="stat">{{ correlation }}</div>
    </div>
</div>

<br>

<!-- GRAPHIQUES -->
<div class="dashboard-grid">

    <div class="card">
        <h3>Répartition par filière</h3>
        <canvas id="barChart"></canvas>
    </div>

    <div class="card">
        <h3>Distribution des notes</h3>
        <canvas id="lineChart"></canvas>
    </div>

</div>

<br>

<div class="card">
    <h3>Données</h3>
    {{ table | safe }}
</div>

</div>

<script>

// BAR CHART
new Chart(document.getElementById("barChart"), {
    type: 'bar',
    data: {
        labels: {{ major_counts.keys() | list | safe }},
        datasets: [{
            label: "Étudiants",
            data: {{ major_counts.values() | list | safe }},
            backgroundColor: "#1a73e8"
        }]
    },
    options: {
        animation: {
            duration: 2000
        }
    }
});

// LINE CHART (notes)
new Chart(document.getElementById("lineChart"), {
    type: 'line',
    data: {
        labels: [...Array({{ table|length }}).keys()],
        datasets: [{
            label: "Notes",
            data: {{ table|safe }},
        }]
    }
});

</script>

</body>
</html>
