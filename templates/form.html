<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire - EduAnalytics</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">📊 EduAnalytics</div>
            <ul class="nav-links">
                <li><a href="/">Accueil</a></li>
                <li><a href="/form" class="active">Formulaire</a></li>
                <li><a href="/dashboard">Dashboard</a></li>
            </ul>
        </div>
    </nav>

    <div class="form-container">
        <div class="form-header">
            <h2>📝 Nouvel étudiant</h2>
            <p>Renseignez les informations académiques</p>
        </div>

        <form action="/submit" method="POST" class="form-rose">
            <div class="form-group">
                <label>Nom complet *</label>
                <input type="text" name="name" required placeholder="Jean Dupont">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Âge *</label>
                    <input type="number" name="age" required min="16" max="100">
                </div>
                <div class="form-group">
                    <label>Heures/semaine *</label>
                    <input type="number" name="hours" required step="0.5" min="0" max="60">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Note /20 *</label>
                    <input type="number" name="grade" required step="0.01" min="0" max="20">
                </div>
                <div class="form-group">
                    <label>Niveau *</label>
                    <select name="level" required>
                        <option value="">Sélectionner</option>
                        <option value="L1">Licence 1</option>
                        <option value="L2">Licence 2</option>
                        <option value="L3">Licence 3</option>
                        <option value="M1">Master 1</option>
                        <option value="M2">Master 2</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Filière *</label>
                <select name="major" required>
                    <option value="">Sélectionner</option>
                    <option value="Informatique">Informatique</option>
                    <option value="Mathématiques">Mathématiques</option>
                    <option value="Physique">Physique</option>
                    <option value="Biologie">Biologie</option>
                    <option value="Économie">Économie</option>
                </select>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-submit">✅ Enregistrer</button>
                <a href="/dashboard" class="btn-cancel">❌ Annuler</a>
            </div>
        </form>
    </div>
</body>
</html>
